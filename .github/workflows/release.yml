name: Release

on:
  push:
    tags: ["v*-bondata.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    # The runner's glibc (2.35) is the oldest the binary runs on; a newer runner raises it.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STEM="i18n-tasks-rs-$VERSION-linux-x86_64"
          I18N_TASKS_VERSION="$VERSION" cargo build --locked --release
          test "$(target/release/i18n-tasks-rs -V)" = "i18n-tasks-rs $VERSION"
          mkdir -p "dist/$STEM/bin"
          cp -f target/release/i18n-tasks-rs "dist/$STEM/bin/"
          tar -C dist -czf "dist/$STEM.tar.gz" "$STEM"
          cd dist
          sha256sum -- *.tar.gz | tee SHA256SUMS.txt

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "i18n-tasks-rs $GITHUB_REF_NAME" --generate-notes --verify-tag -- *.tar.gz SHA256SUMS.txt
